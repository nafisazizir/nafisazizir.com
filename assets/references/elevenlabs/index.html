<style>
body{margin:0;background:#0b0b0c;color:#ddd;font:13px/1.4 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:#0b0b0cee;backdrop-filter:blur(12px);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid #222}
button{background:#1a1a1c;color:#bbb;border:1px solid #2a2a2e;border-radius:99px;padding:4px 10px;cursor:pointer;font:inherit}

main{columns:300px;column-gap:10px;padding:12px}

figure img{width:100%;display:block;cursor:zoom-in} figcaption{padding:6px 9px;color:#888;font-size:11.5px}

#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:96vw;max-height:94vh}
.art{position:relative}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
figure:hover .acts,figure.love .acts,figure.avoid .acts{opacity:1}
.acts button{width:30px;height:30px;padding:0;background:#000b;border-color:#fff3;color:#fff;font-size:14px}
figure.love{box-shadow:0 0 0 2px #ff6b9d} figure.love .acts [data-a=love]{background:#ff6b9d;color:#111}
figure.avoid img{opacity:.35} figure.avoid .acts [data-a=avoid]{background:#eee;color:#111}
.tags{display:none;padding:7px 9px 0;flex-wrap:wrap;gap:4px} figure.love .tags,figure.avoid .tags{display:flex}
.tags button{padding:2px 8px;font-size:11px}
.tags input{flex:1 1 100%;background:#0b0b0c;border:1px solid #2a2a2e;border-radius:6px;color:#ddd;padding:5px 7px;font:inherit;font-size:11.5px}
#lb{flex-direction:column;gap:10px} #lbc{color:#aaa;font-size:12px;text-align:center} #lbc b{color:#ff6b9d}
#save{color:#777} #save.err{color:#f66} .hint{color:#555;font-size:11px}

// Picks: verdict (love | avoid), "what I like" tags, a note. Saved to picks.json
// through serve.py when served over http; localStorage + export when opened as file://.
const TAGS=["palette","shape","motion","texture","light","composition"];
const live=location.protocol.startsWith("http"),KEY="el-picks";
let P={};const st={c:"all",s:"all",v:"all"};let L=[],cur=-1;
const g=document.getElementById("g"),lb=document.getElementById("lb"),$save=document.getElementById("save");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vOf=f=>P[f]?.verdict||"none";
function fig(x){const p=P[x.f]||{},v=vOf(x.f);
return `<figure data-f="${x.f}" class="${v}"><div class="art"><img loading="lazy" src="${x.f}"><div class="acts"><button data-a="love" title="pick (L)">♥</button><button data-a="avoid" title="avoid (X)">✕</button></div></div>
<div class="tags">${TAGS.map((t,k)=>`<button data-t="${t}" class="${p.tags?.includes(t)?"on":""}" title="${k+1}">${t}</button>`).join("")}<input placeholder="what about it? (note)" value="${esc(p.note||"")}"></div>
<figcaption><b>${x.c}</b> · ${x.s} · ${x.w}×${x.h}<br>${x.p||""} ${x.n?"— "+x.n:""}${x.u?` · <a href="${x.u}" target="_blank">src</a>`:""}<br><span style="color:#555">${x.f}</span></figcaption></figure>`}
function r(){L=D.filter(x=>(st.c=="all"||x.c==st.c)&&(st.s=="all"||x.s==st.s)&&(st.v=="all"||vOf(x.f)==st.v));
g.innerHTML=L.map(fig).join("");counts();
document.querySelectorAll("header button[data-g]").forEach(b=>b.classList.toggle("on",st[b.dataset.g]==b.dataset.v));}
function counts(){const n=Object.values(P),lv=n.filter(p=>p.verdict=="love").length,av=n.filter(p=>p.verdict=="avoid").length;
document.getElementById("count").textContent=`${L.length} / ${D.length} · ♥ ${lv} · ✕ ${av}`;}
function refresh(f){const el=g.querySelector(`figure[data-f="${CSS.escape(f)}"]`),x=D.find(d=>d.f==f);if(el)el.outerHTML=fig(x);counts();if(cur>=0)lbCap();}
function setVerdict(f,v){const p=P[f]||{tags:[],note:""};if(p.verdict==v){delete P[f]}else{p.verdict=v;P[f]=p}save();refresh(f)}
function toggleTag(f,t){const p=P[f];if(!p)return;p.tags=p.tags.includes(t)?p.tags.filter(z=>z!=t):[...p.tags,t];save();refresh(f)}
function payload(){const picks={};Object.keys(P).sort().forEach(f=>{const x=D.find(d=>d.f==f)||{};picks[f]={...P[f],category:x.c,source:x.s,palette:x.p||""}});
return JSON.stringify({version:1,updated:new Date().toISOString(),picks},null,2)}
let tm;function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch{}
if(!live){$save.textContent="file:// — local only, export to keep";return}
clearTimeout(tm);$save.textContent="saving…";$save.className="";
tm=setTimeout(async()=>{try{const res=await fetch("picks.json",{method:"PUT",body:payload()});$save.textContent=res.ok?"saved":"save failed";$save.className=res.ok?"":"err"}catch{$save.textContent="save failed";$save.className="err"}},400)}
async function load(){try{P=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
if(live){try{const res=await fetch("picks.json",{cache:"no-store"});if(res.ok){const j=await res.json();P={};for(const[f,p]of Object.entries(j.picks||{}))P[f]={verdict:p.verdict,tags:p.tags||[],note:p.note||""}}}catch{}}
$save.textContent=live?"":"file:// — run serve.py to save to disk";r()}
document.querySelector("header").onclick=e=>{const b=e.target.closest("button");if(!b)return;
if(b.id=="export"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload()],{type:"application/json"}));a.download="picks.json";a.click();return}
st[b.dataset.g]=b.dataset.v;r()};
g.onclick=e=>{const fe=e.target.closest("figure");if(!fe)return;const f=fe.dataset.f,b=e.target.closest("button");
if(b?.dataset.a)return setVerdict(f,b.dataset.a);if(b?.dataset.t)return toggleTag(f,b.dataset.t);
if(e.target.tagName=="IMG"){cur=L.findIndex(x=>x.f==f);lbShow()}};
g.oninput=e=>{if(e.target.tagName!="INPUT")return;const f=e.target.closest("figure").dataset.f;if(P[f]){P[f].note=e.target.value;save()}};
function lbShow(){lb.querySelector("img").src=L[cur].f;lb.style.display="flex";lbCap()}
function lbCap(){const f=L[cur].f,p=P[f];document.getElementById("lbc").innerHTML=`${cur+1} / ${L.length} · ${f}<br>${p?`<b>${p.verdict=="love"?"♥ pick":"✕ avoid"}</b> ${p.tags.join(", ")}`:"unrated"}<br><span class="hint">← → browse · L pick · X avoid · 1–6 tags · esc close</span>`}
lb.onclick=()=>{lb.style.display="none";cur=-1};
addEventListener("keydown",e=>{if(cur<0||e.target.tagName=="INPUT")return;const f=L[cur].f,k=e.key.toLowerCase();
if(k=="escape")lb.onclick();else if(k=="arrowright"){cur=(cur+1)%L.length;lbShow()}else if(k=="arrowleft"){cur=(cur-1+L.length)%L.length;lbShow()}
else if(k=="l"||k=="f")setVerdict(f,"love");else if(k=="x")setVerdict(f,"avoid");else if(k>="1"&&k<="6")toggleTag(f,TAGS[+k-1]);});
load();
</script>
