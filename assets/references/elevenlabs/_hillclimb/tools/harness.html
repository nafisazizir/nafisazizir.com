<!doctype html>
<html><body style="margin:0;background:#000">
<script type="module">
// Loaded by server.mjs in headless Chrome. Uses the site's real renderer.
let R = null, ver = "", presets = null
async function ensure() {
  const v = await (await fetch("/version", { cache: "no-store" })).text()
  if (v === ver && R) return
  const r = await import(`/mod/renderer.js?v=${v}`)
  presets = await import(`/mod/presets.js?v=${v}`)
  R?.dispose()
  R = r.createStreakRenderer()
  ver = v
}

function full(p) {
  const P = { ...presets.STREAK_DEFAULTS, ...p }
  const clamped = []
  for (const s of presets.STREAK_PARAMS) {
    let v = +P[s.key]
    if (!Number.isFinite(v)) v = presets.STREAK_DEFAULTS[s.key]
    const c = Math.min(s.max, Math.max(s.min, v))
    if (c !== v) clamped.push(s.key)
    P[s.key] = c
  }
  return { P, clamped }
}

function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c }

function render(p, W, H, samples = 40) {
  const c = canvas(W, H), ctx = c.getContext("2d", { willReadFrequently: true })
  R.render(ctx, W, H, p, { samples, layers: p.layers })
  return c
}

const imgCache = new Map()
async function loadImg(path) {
  if (imgCache.has(path)) return imgCache.get(path)
  const im = new Image()
  im.src = "/ref/" + path.split("/").map(encodeURIComponent).join("/")
  await im.decode()
  imgCache.set(path, im)
  return im
}
function drawImg(im, W, H, crop) {
  const c = canvas(W, H), ctx = c.getContext("2d", { willReadFrequently: true })

    const [x, y, w, h] = crop
    ctx.drawImage(im, x * im.naturalWidth, y * im.naturalHeight, w * im.naturalWidth, h * im.naturalHeight, 0, 0, W, H)
  } else ctx.drawImage(im, 0, 0, W, H)

}
const pixels = (c) => c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, c.width, c.height).data

// ---- texture (layers) ------------------------------------------------------
// Grain lives at native resolution, so this works on native-size crops of the
// reference: smooth regions (no text, no edges), where the only fine detail is
// the surface texture. Candidate layer stacks are laid over a cached native
// render of the streaks with the site's real layer pass, so each candidate
// costs a few ms.

async function layerPass() {
  if (LP && LPver === ver) return LP

  const { c, gl, post } = LP

  const out = canvas(w, h)
  if (!stack) { out.getContext("2d").drawImage(src, 0, 0); return out }
  c.width = w; c.height = h
  gl.viewport(0, 0, w, h)
  gl.bindTexture(gl.TEXTURE_2D, stack.texture)

function pickCrops(refFull, rects, n = 3, S = 320) {

  const tone = [byL.slice(0, t), byL.slice(t, 2 * t), byL.slice(2 * t)].map((p) => mad(p.map((q) => q[1])))
  const meanL = keep.reduce((acc, i) => acc + L[i], 0) / keep.length
  return { bands, chroma, tone, meanL }
}
function texAvg(list) {
  const lg = (v) => Math.log(v + 0.05)
  const avg = (f) => list.reduce((a, s) => a + f(s), 0) / list.length
  return {
    bands: [0, 1, 2, 3].map((b) => Math.exp(avg((s) => lg(s.bands[b]))) - 0.05),
    chroma: avg((s) => s.chroma),
    tone: [0, 1, 2].map((b) => Math.exp(avg((s) => lg(s.tone[b]))) - 0.05),
    meanL: avg((s) => s.meanL),
  }
}
// Lower is better. Fine bands weigh most: they're what grain is.
const BAND_W = [1.5, 1.2, 0.8, 0.5]
function texDist(r, o) {
  const lr = (a, b) => Math.abs(Math.log((b + 0.15) / (a + 0.15)))
  const bands = r.bands.reduce((s, v, i) => s + BAND_W[i] * lr(v, o.bands[i]), 0)
  const chroma = 1.5 * Math.abs(r.chroma - o.chroma)
  // The shape of the tone response, relative to its own mids.
  const rel = (s) => [s.tone[0] / (s.tone[1] + 0.1), s.tone[2] / (s.tone[1] + 0.1)]
  const rr = rel(r), oo = rel(o)
  const tone = 0.5 * (Math.abs(Math.log((rr[0] + 0.1) / (oo[0] + 0.1))) + Math.abs(Math.log((rr[1] + 0.1) / (oo[1] + 0.1))))
  // Layers mustn't shift the brightness either.
  const shift = 0.05 * Math.abs(r.meanL - o.meanL)
  const r3 = (v) => Math.round(v * 1000) / 1000
  return { score: r3(bands + chroma + tone + shift), bands: r3(bands), chroma: r3(chroma), tone: r3(tone), shift: r3(shift) }
}

const baseCache = new Map()
async function texture(j) {
  const T = [], t0 = performance.now(), mark = (k) => T.push(k + ":" + Math.round(performance.now() - t0))
  await layerPass(); mark("lp")
  const im = await loadImg(j.ref)
  const W = im.naturalWidth, H = im.naturalHeight
  const refFull = drawImg(im, W, H)
  mark("img")
  const crops = j.crops || pickCrops(refFull, j.mask, j.nCrops || 3, j.cropSize || 320)
  mark("pick")
  const refCrops = crops.map((c) => crop(refFull, c.x, c.y, c.w, c.h))
  const ref = texAvg(refCrops.map(texStats))
  mark("refstats")
  const { P } = full(j.params)
  const key = JSON.stringify([P, W, H, j.samples || 40])
  if (!baseCache.has(key)) {
    baseCache.clear()
    const full_ = render(P, W, H, j.samples || 40)
    baseCache.set(key, crops.map((c) => crop(full_, c.x, c.y, c.w, c.h)))
  }
  const base = baseCache.get(key)
  mark("base")
  // Optionally round-trip through the reference's own codec, so compression
  // softens our grain the way it softened theirs.
  const codec = async (cv) => {
    if (!j.codec) return cv
    const url = cv.toDataURL(j.codec.type, j.codec.q)
    const img = new Image(); img.src = url; await img.decode()
    const o = canvas(cv.width, cv.height); o.getContext("2d").drawImage(img, 0, 0); return o
  }
  const evalStack = async (layers) => {
    const cs = []
    for (let i = 0; i < crops.length; i++) cs.push(await codec(overlay(base[i], crops[i].x, crops[i].y, W, H, layers)))
    const st = texAvg(cs.map(texStats))
    return { stats: st, dist: texDist(ref, st), cs }
  }
  const out = { crops, ref, size: [W, H] }
  const cands = []
  for (const L of j.candidates || [[]]) {
    const e = await evalStack(L)
    cands.push({ stats: e.stats, dist: e.dist })
    if (j.image && cands.length === 1) {
      // ref crops over our crops, 1:1, for judging by eye.
      const rows = crops.map((_, i) => stack([refCrops[i], e.cs[i]], 4))
      const o = canvas(rows[0].width, rows.reduce((s, r) => s + r.height + 4, -4))
      let y = 0; for (const r of rows) { o.getContext("2d").drawImage(r, 0, y); y += r.height + 4 }
      out.image = o.toDataURL("image/png")
    }
  }
  out.cands = cands
  mark("cands")
  out.timing = T.join(" ")
  return out
}

window.job = async (j) => {
  await ensure()
  const t0 = performance.now()
  if (j.kind === "sheet") return sheet(j)
  if (j.kind === "texture") { const o = await texture(j); o.ms = Math.round(performance.now() - t0); return o }
  const { P, clamped } = full(j.params)
  let W = j.width || 640
  const im = j.ref ? await loadImg(j.ref) : null
  const aspect = im ? im.naturalWidth / im.naturalHeight : 16 / 9
  let H = j.height || Math.round(W / aspect)
  const out = { clamped }
  if (im && j.kind !== "render-only") {
    // Score at a fixed width so numbers are comparable across calls.
    const sw = j.scoreWidth || 320, sh = Math.round(sw / aspect)
    out.metric = metric(drawImg(im, sw, sh), render(P, sw, sh, j.samples || 40), j.mask, j.automask !== false)
  }
  if (j.kind === "score") { out.ms = Math.round(performance.now() - t0); return out }
  let ren, ref
  if (j.crop) {
    const [, , cw, ch] = j.crop
    const fw = Math.min(4096, Math.round(W / cw)), fh = Math.round(fw / aspect)
    const big = render(P, fw, fh, j.samples || 48)
    H = Math.round((W * ch * fh) / (cw * fw))
    ren = canvas(W, H); ren.getContext("2d").drawImage(big, j.crop[0] * fw, j.crop[1] * fh, cw * fw, ch * fh, 0, 0, W, H)
    if (im) ref = drawImg(im, W, H, j.crop)
  } else {
    ren = render(P, W, H, j.samples || 40)
    if (im) ref = drawImg(im, W, H)
  }
  out.render = ren.toDataURL("image/png")
  if (ref) {
    const parts = [ref, ren]
    if (j.diff) parts.push(heat(ref, ren, j.mask))
    out.compare = stack(parts).toDataURL("image/png")
  }
  out.ms = Math.round(performance.now() - t0)
  return out
}

async function sheet(j) {
  const cw = j.cellWidth || 300, gap = 8, lab = 22, cols = j.cols || 2
  const rows = []
  for (let i = 0; i < j.items.length; i += cols) rows.push(j.items.slice(i, i + cols))
  const pairs = []
  for (const it of j.items) {
    const im = await loadImg(it.ref)
    const a = im.naturalWidth / im.naturalHeight, h = Math.round(cw / a)
    const { P } = full(it.params)
    const ren = render(P, cw * 2, h * 2, 40)
    const r = canvas(cw, h); r.getContext("2d").drawImage(ren, 0, 0, cw, h)
    const rc = drawImg(im, cw, h)
    if (j.showMask) {
      const m = maskFor(cw, h, it.mask, autoMask(rc)), x = rc.getContext("2d"), id = x.getImageData(0, 0, cw, h)
      for (let i = 0; i < m.length; i++) if (!m[i]) { id.data[4 * i] = 255; id.data[4 * i + 1] = 0; id.data[4 * i + 2] = 255 }
      x.putImageData(id, 0, 0)
    }
    pairs.push({ it, ref: rc, ren: r, h })
  }
  const pw = cw * 2 + 4, W = cols * pw + (cols - 1) * gap * 3
  const rh = rows.map((_, ri) => Math.max(...pairs.slice(ri * cols, ri * cols + cols).map((p) => p.h)) + lab + gap * 2)
  const H = rh.reduce((s, h) => s + h, 0)
  const o = canvas(W, H), ctx = o.getContext("2d")
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, W, H); ctx.font = "15px ui-monospace, monospace"
  let y = 0
  rows.forEach((row, ri) => {
    row.forEach((_, ci) => {
      const p = pairs[ri * cols + ci], x = ci * (pw + gap * 3)
      ctx.fillStyle = "#ddd"; ctx.fillText(p.it.label || p.it.id, x, y + 16)
      ctx.drawImage(p.ref, x, y + lab); ctx.drawImage(p.ren, x + cw + 4, y + lab)
    })
    y += rh[ri]
  })
  return { sheet: o.toDataURL("image/png") }
}
</script>
